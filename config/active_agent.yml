default: &default
  ollama:
    service: "Ollama"
    base_url: <%= ENV.fetch("OLLAMA_BASE_URL", "http://127.0.0.1:11434/v1") %>
    model: <%= ENV.fetch("OLLAMA_MODEL", "gemma3:4b") %>
    timeout: 30
    max_retries: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
